<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MEMORA — a private, multimodal personal journal for words, voice, photographs and the people who matter."
    />
    <meta name="theme-color" content="#FAF8F4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MEMORA</title>
    <script>
      // Applied before the first paint so a saved size/contrast mode never
      // flashes. Mirrors src/hooks/useAccessibility.ts (key "a11y-settings").
      ;(function () {
        var root = document.documentElement
        var systemContrast = false
        try {
          systemContrast = window.matchMedia('(prefers-contrast: more)').matches
        } catch (error) {
          systemContrast = false
        }
        var settings = null
        try {
          var raw = window.localStorage.getItem('a11y-settings')
          var parsed = raw ? JSON.parse(raw) : null
          if (parsed && typeof parsed === 'object') {
            settings = parsed
          }
        } catch (error) {
          settings = null
        }
        var textSize =
          settings && (settings.textSize === 'large' || settings.textSize === 'xl')
            ? settings.textSize
            : 'default'
        var highContrast =
          settings && typeof settings.highContrast === 'boolean'
            ? settings.highContrast
            : systemContrast
        root.setAttribute('data-text-size', textSize)
        if (highContrast) root.setAttribute('data-contrast', 'high')
        if (settings && settings.dyslexia === true) {
          root.setAttribute('data-dyslexia', 'true')
        }
        if (settings && settings.underlineLinks === true) {
          root.setAttribute('data-underline-links', 'true')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
